name: memory vaults (v3 + v4)

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate-v3-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r examples/v3-minimal-vault/requirements.txt
      - name: Lint v3 vault
        working-directory: examples/v3-minimal-vault
        run: python tools/lint.py
      - name: Run full unittest suite (v3 + v4)
        run: python -m unittest discover -s tests
      - name: Rebuild v3 views (deterministic, drift check)
        working-directory: examples/v3-minimal-vault
        run: |
          MEMORY_TODAY=2026-05-11 tools/rebuild-views.sh
          git diff --exit-code -- memory/_views

  validate-v4-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r examples/v4-minimal-vault/requirements.txt
      - name: Lint v4 vault
        working-directory: examples/v4-minimal-vault
        run: python tools/lint.py
      - name: Rebuild v4 views (deterministic, drift check)
        working-directory: examples/v4-minimal-vault
        run: |
          MEMORY_TODAY=2026-07-01 tools/rebuild-views.sh
          git diff --exit-code -- memory/_views
      - name: Rebuild v4 indexes (deterministic, drift check)
        working-directory: examples/v4-minimal-vault
        run: |
          tools/rebuild-indexes.sh
          git diff --exit-code -- memory/_indexes/
