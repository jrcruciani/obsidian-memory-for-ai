type: skill
required:
  - type
  - id
  - slug
  - title
  - status
  - version
  - domain
  - triggers
  - verification
  - trust
  - observed_at
  - last_confirmed
fields:
  type:
    kind: str
    enum:
      - skill
  id:
    kind: str
  slug:
    kind: str
  title:
    kind: str
  status:
    kind: str
    enum:
      - active
      - superseded
      - deprecated
      - retracted
  version:
    kind: int
  domain:
    kind: str
  triggers:
    kind: list
  inputs:
    kind: list
  outputs:
    kind: list
  verification:
    kind: list
  entities:
    kind: list
  derived_from:
    kind: list
  trust:
    kind: str
    enum:
      - owner
      - agent
      - external
  confidence:
    kind: confidence
    nullable: true
  observed_at:
    kind: datetime
  last_confirmed:
    kind: date
  review_after:
    kind: date
    nullable: true
  supersedes:
    kind: str
    nullable: true
  pinned:
    kind: bool
  retracted_at:
    kind: datetime
    nullable: true
  retraction_reason:
    kind: str
    nullable: true
